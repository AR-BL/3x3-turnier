<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: heller Grund, ein Navy-Akzentband als Kopf, darunter Zeitleiste mit zwei Courts nebeneinander, dann Tabellen und Endstand */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --fg:#00122D; --muted:#56607A; --line:#DCE1EA;
  --accent:#B55709; --accent-fill:#E5710B; --blue:#0028AA; --win-bg:#FDF1E6;
  --mine:#E8EDFB; --ok:#1C7C4A; --err:#B3261E; --input:#FFFFFF;
  --band:radial-gradient(110% 100% at 100% 0%,#0028AA 0%,#00122D 100%);
  --f:"Lexend",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07101F; --surface:#0F1B31; --fg:#ECF0F7; --muted:#9AA5BC; --line:#22304C;
  --accent:#F39A45; --accent-fill:#E5710B; --blue:#8EA6FF; --win-bg:#2A1D10;
  --mine:#16264A; --ok:#5CC58C; --err:#FF8A80; --input:#0A1426; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07101F; --surface:#0F1B31; --fg:#ECF0F7; --muted:#9AA5BC; --line:#22304C;
  --accent:#F39A45; --accent-fill:#E5710B; --blue:#8EA6FF; --win-bg:#2A1D10;
  --mine:#16264A; --ok:#5CC58C; --err:#FF8A80; --input:#0A1426; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:300;font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.top img{width:44px;height:44px}
.top .brand{font-weight:800;letter-spacing:.01em}
.top .sp{flex:1}
.band{background:var(--band);color:#fff}
.band .wrap{padding-block:28px 30px;display:grid;gap:10px}
.eyebrow{font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#F7A35C}
h1{font-weight:900;font-size:clamp(30px,6vw,52px);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:normal;color:#E5710B}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:#D5DCEB}
.facts b{font-weight:600;color:#fff}
.stand{font-size:13px;color:#BFC8DC}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
main.wrap{display:grid;gap:28px;padding-block:22px 48px}
h2{font-weight:800;font-size:22px;margin:0;text-wrap:balance}
.sec{display:grid;gap:14px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.note{background:var(--win-bg);border:1px solid var(--accent-fill);border-radius:10px;padding:12px 14px;font-weight:400}
.note b{font-weight:600}
.next{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;min-width:0}
.nx .lbl{font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--accent)}
.nx .m{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.nx .s{color:var(--muted);font-size:13px}
.filter{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],textarea{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:60px;resize:vertical}
label.chk{display:flex;gap:6px;align-items:center;font-size:14px}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;font-weight:600}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.courthead{display:grid;grid-template-columns:64px repeat(2,minmax(0,1fr));gap:10px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.courthead span:first-child{visibility:hidden}
.tl{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:stretch}
.slot time{font-weight:800;font-variant-numeric:tabular-nums;padding-top:10px}
.courts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.courts.one{grid-template-columns:minmax(0,1fr)}
.prog .lab{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-weight:400}
.prog.key .lab{border-style:solid;border-color:var(--accent-fill);color:var(--fg);font-weight:600}
.game{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.game.mine{background:var(--mine);border-color:var(--blue)}
.game.final{border-color:var(--accent-fill);border-width:2px}
.gm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.gm .ph{font-weight:600;color:var(--fg)}
.gm .ct{display:none}
.tm{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tm span{overflow-wrap:anywhere;font-weight:400}
.tm.win span{font-weight:600}
.tm.ph span{font-style:italic;color:var(--muted)}
.tm b{font-weight:800;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.tm.win b{color:var(--accent)}
.tm input{width:4.2em;text-align:right}
.adm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.adm input[type=text]{width:5.2em}
.adm select{max-width:100%}
.adm .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;overflow-x:auto}
.tbox h3{margin:0 0 6px;font-weight:800;font-size:16px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
th{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.n,th.n{text-align:left}
tr.q td{font-weight:600}
tr.q td:first-child{color:var(--accent)}
tr.mine td{background:var(--mine)}
.small{font-size:13px;color:var(--muted)}
.final-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;list-style:none;padding:0;margin:0}
.final-list li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.final-list .p{font-weight:900;font-variant-numeric:tabular-nums;width:2.2ch;text-align:right}
.final-list li.podium .p{color:var(--accent)}
.final-list .t{font-weight:400;overflow-wrap:anywhere}
.final-list .t.open{color:var(--muted);font-style:italic}
.panel{background:var(--surface);border:2px solid var(--blue);border-radius:12px;padding:14px;display:grid;gap:12px}
.panel h2{font-size:18px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tgrid div{display:grid;gap:6px}
.tgrid input{width:100%}
.flash{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--fg);color:var(--bg);font-weight:600;text-align:center;z-index:20}
.flash.err{background:var(--err);color:#fff}
.flash.ok{background:var(--ok);color:#fff}
footer{color:var(--muted);font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tabs a{padding:13px 14px 11px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent-fill)}
.tabs a:hover{color:var(--fg)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.rule h3{margin:0 0 8px;font-weight:800;font-size:16px}
.rule ul{margin:0;padding-left:18px;display:grid;gap:6px}
.rule p{margin:0 0 6px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
@media (max-width:640px){
  .courthead{display:none}
  .slot{grid-template-columns:minmax(0,1fr);gap:6px}
  .slot time{padding-top:0}
  .courts,.tables,.final-list,.tgrid,.next,.rules{grid-template-columns:minmax(0,1fr)}
  .gm .ct{display:inline}
}
@media (prefers-reduced-motion:no-preference){.game{transition:background .2s}}

var DEFAULT_REGELN="## Spielzeit und Sieg\n- Spielzeit: {spielzeit}. Die Uhr läuft durch, nur bei Verletzungen hält die Spielleitung sie an.\n- Wer zuerst 21 Punkte erreicht, gewinnt sofort.\n- Steht es nach Ablauf der Zeit unentschieden, gibt es Verlängerung. Das Team, das darin zuerst 2 Punkte erzielt, gewinnt.\n## Punkte\n- Korb innerhalb des Bogens: 1 Punkt.\n- Korb von außerhalb des Bogens: 2 Punkte.\n- Freiwurf: 1 Punkt.\n## Teams und Wechsel\n- Auf dem Feld stehen je Team 3 Spieler*innen.\n- Wechseln ist beliebig oft erlaubt, aber nur bei totem Ball (nach Korb, Foul oder Aus). Die neue Person kommt hinter der Grundlinie gegenüber dem Korb aufs Feld, nachdem sie abgeklatscht hat.\n## Ballbesitz\n- Das im Spielplan zuerst genannte Team hat den ersten Ballbesitz.\n- Zu Spielbeginn und nach jedem toten Ball gibt es Check-Ball: Die Verteidigung übergibt den Ball oben hinter dem Bogen an den Angriff.\n- Nach einem Korb wechselt der Ballbesitz. Das Team, das den Korb kassiert hat, startet direkt unter dem Korb und bringt den Ball per Dribbling oder Pass hinter den Bogen.\n- Nach Rebound oder Ballgewinn der Verteidigung muss der Ball erst hinter den Bogen, bevor das Team auf den Korb wirft.\n- Bei Sprungball-Situationen erhält die Verteidigung den Ball.\n## Fouls und Zeitspiel\n- Fouls pfeift die Spielleitung am Court.\n- Foul ohne Wurf: Check-Ball für das gefoulte Team.\n- Foul beim Wurf: 1 Freiwurf innerhalb, 2 Freiwürfe außerhalb des Bogens. Fällt der Korb trotzdem, zählt er, dazu kommt 1 Freiwurf.\n- Hält ein Team den Ball deutlich zu lange, gibt es eine Verwarnung, beim nächsten Mal Ballverlust.\n## Pünktlichkeit\n- Teams sind 5 Minuten vor Spielbeginn am Court.\n- Wer zur angesetzten Zeit nicht spielbereit ist, verliert das Spiel mit 0:21.\n## Wertung\n- Tabelle: Siege, bei zwei punktgleichen Teams der direkte Vergleich, dann Korbdifferenz, dann erzielte Punkte.\n- Platz 1 und 2 jeder Gruppe spielen das Halbfinale, alle anderen Teams spielen um die weiteren Plätze.\n## Fair Play\n- Fairness geht vor Ergebnis.\n- Entscheidungen der Spielleitung gelten. Rückfragen klärt eine Person je Team mit der Turnierleitung am Kampfgericht.";

function stand(grp){

  var rows=S.teams[grp].map(function(n){return{n:n,sp:0,s:0,nl:0,pf:0,pa:0}});
  var by={};rows.forEach(function(r){by[r.n]=r});
  var gs=S.games.filter(function(g){return g.phase===PH[grp]});
  gs.filter(has).forEach(function(g){var a=by[tname(g.t1)],b=by[tname(g.t2)];if(!a||!b)return;a.sp++;b.sp++;a.pf+=g.s1;a.pa+=g.s2;b.pf+=g.s2;b.pa+=g.s1;if(g.s1>g.s2){a.s++;b.nl++}else{b.s++;a.nl++}});
  rows.sort(function(x,y){return y.s-x.s||(y.pf-y.pa)-(x.pf-x.pa)||y.pf-x.pf||x.n.localeCompare(y.n)});
  for(var i=0;i<rows.length-1;i++){
    var w=rows[i].s,tied=rows.filter(function(r){return r.s===w});
    if(tied.length===2&&rows[i+1].s===w){
      var a=rows[i],b=rows[i+1];
      var h=gs.filter(has).find(function(g){var x=tname(g.t1),y=tname(g.t2);return(x===a.n&&y===b.n)||(x===b.n&&y===a.n)});
      if(h){var win=h.s1>h.s2?tname(h.t1):tname(h.t2);if(win===b.n){rows[i]=b;rows[i+1]=a}}

  cache[grp]=res;return res;

function saveGame(nr){
  var s1=num('s1-'+nr),s2=num('s2-'+nr),z=(q('#z-'+nr).value||'').trim(),c=+q('#c-'+nr).value;
  var o1=q('#o1-'+nr),o2=q('#o2-'+nr);
  if(Number.isNaN(s1)||Number.isNaN(s2))return flash('Bitte nur ganze Zahlen als Punkte eintragen.','err');

  save(function(st){var g=st.games.find(function(x){return x.nr===nr});g.s1=s1;g.s2=s2;g.zeit=z;g.court=c;if(o1)g.o1=o1.value;if(o2)g.o2=o2.value});

function saveMeta(){
  var ren={},names=[],bad=false;
  ['A','B'].forEach(function(gr){S.teams[gr].forEach(function(t,i){var v=(q('#tn-'+gr+i).value||'').trim();if(!v)bad=true;names.push(v);if(v!==t)ren[t]=v})});
  if(bad)return flash('Jedes Team braucht einen Namen.','err');
  if(new Set(names).size!==names.length)return flash('Zwei Teams haben denselben Namen. Bitte eindeutig benennen.','err');
  if(!Object.keys(ren).length)return flash('Keine Änderung an den Teamnamen.','err');
  save(function(st){
    ['A','B'].forEach(function(gr){st.teams[gr]=st.teams[gr].map(function(t){return ren[t]||t})});
    st.games.forEach(function(g){['o1','o2'].forEach(function(k){if(g[k]&&ren[g[k]])g[k]=ren[g[k]]})});
    Object.keys(ren).forEach(function(o){if(st.pool.indexOf(ren[o])<0)st.pool.push(ren[o])});
  });
}

  FB.runTransaction(FB.db,function(tx){return tx.get(FB.ref).then(function(snap){
    var st=snap.exists()?JSON.parse(snap.data().json):JSON.parse(JSON.stringify(S));
    mut(st);st.updated=new Date().toISOString();tx.set(FB.ref,{json:JSON.stringify(st)});
  })}).then(function(){busy=false;pendFmt=null;pendConfirm=false;render();flash('Gespeichert.','ok')},function(e){busy=false;render();
    var c=e&&e.code||'';
    if(/permission-denied/.test(c))flash('Keine Berechtigung. Bitte abmelden und neu anmelden.','err');
    else if(/unavailable|network/.test(c))flash('Keine Verbindung. Bitte Internet prüfen und erneut speichern.','err');
    else flash('Speichern hat nicht geklappt. Bitte erneut versuchen.','err');})
}
